<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="calc.css">
    <title>Калькулятор</title>

</head>
<body>
    <div class="main-window">
        <div class="title-bar">
            <div class="title-bar-left-side">
                <img src="CalcXP.ico" class="app-icon" />
                <div>&#8211 Калькулятор</div>
            </div>
            <div class="title-bar-right-side">
                <button class="control-button">             <div class="control-button-signature" style="margin-left:-4px">&#x1F5D5;</div></button>
                <button class="control-button" disabled>    <div class="control-button-signature">&#128470;</div></button>
                <button class="control-button close-button"><div class="control-button-signature close-button-signature">&#10006;</div></button>
            </div>
        </div>
        <!-- ----------------------------------------------------------------------------- -->
        <div class="client-rect">
            <div class="work-area">
                <div class="menu-bar">
                    <button class="menu-button">Правка</button>
                    <button class="menu-button">Вид</button>
                    <button class="menu-button">Справка</button>
                </div>
                <div class="display-container">
                    <input type="text" class="display" id="calcDisplay" value="0"/>
                </div>
                <div class="calc-buttons">
                    <!--<div class="memory-buttons">
                        <div class="square"></div>
                        <button>MC</button>
                        <button>MR</button>
                        <button>MS</button>
                        <button>M+</button>
                    </div>-->
                     <div class="square"></div>
                    <div class="clear-buttons">
                        <button onclick="BackWard()">Backspace</button>
                        <button onclick="deleteNum()">CE</button>
                        <button onclick="deleteNumAndOper()">C</button>
                    </div>
                <!-- ----------------------------------------------- -->
                    <button class="memory-button" onclick="clearMemory()">MC</button>
                    <button id="sevenButt" onclick="setNumber('7')">7</button>
                    <button id="eightButt" onclick="setNumber('8')">8</button>
                    <button id="nineButt" onclick="setNumber('9')">9</button>
                    <button class="operation-button" id="divButt" onclick="setOperation('div')">/</button>
                    <button id="sqrtButt" onclick="sqrt()">sqrt</button>
                <!-- ----------------------------------------------- -->
                    <button class="memory-button" onclick="FromDiplayInMem()">MR</button>
                    <button id="fourButt" onclick="setNumber('4')">4</button>
                    <button id="fiveButt" onclick="setNumber('5')">5</button>
                    <button id="sixButt" onclick="setNumber('6')">6</button>
                    <button class="memory-button" id="multiButt" onclick="setOperation('multi')">*</button>
                    <button id="procentButt" onclick="persentFrom()">%</button>
                <!-- ----------------------------------------------- -->
                    <button class="memory-button" onclick="FromMemInDisplay()">MS</button>
                    <button id="oneButt" onclick="setNumber('1')">1</button>
                    <button id="twoButt" onclick="setNumber('2')">2</button>
                    <button id="threeButt" onclick="setNumber('3')">3</button>
                    <button id="minusButt" class="operation-button" onclick="setOperation('minus')">-</button>
                    <button id="inverButt" onclick="invertNum()">1/x</button>           <!--onclick() - позволяет обратиться к функции из формы (пример: button) -->
                <!-- ----------------------------------------------- -->
                    <button class="memory-button" onclick="AddValueInMem()">M+</button>
                    <button id="nullButt" onclick="setNumber('0')">0</button>
                    <button id="plusMinus" onclick="plusMunus()">+/-</button>
                    <button id="setDot" onclick="setDot()">.</button>
                    <button class="operation-button" id="plusButt" onclick="setOperation('plus')">+</button>
                    <button class="operation-button" id="equalButt" onclick="setOperation('none')">=</button>
                </div>
            </div>
        </div>
    </div>
    <script src="calc.js"></script>
</body>
</html>
